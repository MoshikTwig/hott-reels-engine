name: Daily news posts

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only make the posts (saved under Artifacts), don't send them
        type: boolean
        default: false
      count:
        description: How many posts to write
        default: "3"

permissions:
  contents: write

concurrency:
  group: state-writes

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          pip install -r requirements.txt
          curl -sSfL -o assets/fonts/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Write the posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.news --count "${{ inputs.count || '3' }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save the posts
        uses: actions/upload-artifact@v4
        with:
          name: news-posts
          path: out/*-news/
          retention-days: 14

      - name: Share a preview of a test run
        if: ${{ inputs.dry_run }}
        run: |
          cd out
          git init -q -b previews
          git add .
          git -c user.name=reels-engine -c user.email=reels-engine@users.noreply.github.com commit -qm "News posts preview"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews

      - name: Remember which stories were used
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "reels-engine"
          git config user.email "reels-engine@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Record used news stories"
          git pull --rebase -q && git push
